# Test Configuration
spring.application.name=PR Reviewer Test

# GitHub token for tests (can be overridden)
github-access-token=test-token-for-unit-tests

# AI configuration
spring.ai.openai.api-key=test-key-for-testing
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7

# Rate limiting for tests
github.api.rate-limit=1000

# Logging
logging.level.review.pr=DEBUG
