# Application Configuration
spring.application.name=PR Reviewer

# ===================================================================
# API Configuration - Read from .env file
# ===================================================================

# GitHub Personal Access Token (from .env file)
github-access-token=${GITHUB_TOKEN}

# OpenAI API Key (from .env file)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ===================================================================
# OpenAI Configuration
# ===================================================================

# AI Model Configuration
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7

# ===================================================================
# PR Reviewer Configuration
# ===================================================================

# Initial system prompt for the AI reviewer
pr.reviewer.initial-prompt=You are a PR Code Reviewer. Respond with a JSON object like {"filename": "review comment"}. Here's the git diff:\n

# GitHub API Rate Limiting (requests per hour)
github.api.rate-limit=100

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.review.pr=INFO
logging.level.review.pr.infrastructure=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
